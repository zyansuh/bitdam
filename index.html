    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>빚담 | Bitdam</title>
    <meta name="description" content="전국 양조장의 장인 정신을 담은 프리미엄 전통주 플랫폼" />
    <meta property="og:title" content="빚담 | Bitdam" />
    <meta property="og:description" content="전국 양조장의 장인 정신을 담은 프리미엄 전통주 플랫폼" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/brewery-hero.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="빚담 | Bitdam" />
    <meta name="twitter:description" content="전국 양조장의 장인 정신을 담은 프리미엄 전통주 플랫폼" />
    <script>
      (function () {
        function isTheme(value) {
          return value === 'dark' || value === 'light'
        }
        function themeFromState() {
          try {
            var state = new URLSearchParams(location.search).get('state')
            if (!state) return null
            var token = state.split('.').pop()
            return isTheme(token) ? token : null
          } catch (error) {
            return null
          }
        }
        function themeFromCookie() {
          try {
            var match = document.cookie.match(/(?:^|; )bitdam\.theme=(dark|light)/)
            return match ? match[1] : null
          } catch (error) {
            return null
          }
        }
        try {
          var stored = null
          try {
            stored = localStorage.getItem('bitdam.theme')
          } catch (storageError) {}
          var theme = themeFromState() || themeFromCookie() || (isTheme(stored) ? stored : null)
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
